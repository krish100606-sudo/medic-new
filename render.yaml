services:
  - type: web
    name: health-data-management
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: health-data-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: health-data-db
    databaseName: health_data
    user: health_user
    plan: free
    region: oregon
